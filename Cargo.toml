[package]
name = "RockGit"
version = "0.1.0"
edition = "2024"
[dependencies]
cacao = { version = "0.3", features = ["appkit"] }
font-awesome = "0.2.0"
objc = "0.2"
objc_id = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[patch.crates-io]
block = { path = "vendor/block" }
